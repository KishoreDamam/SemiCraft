name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run ruff
        run: uv run ruff check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pytest
        run: uv run pytest

  lint-gate:
    name: golden lint + tb-compile gate (verilator)
    runs-on: ubuntu-latest
    # WP-04 lands the lint wrapper + its own test suite (backend/tests/lint),
    # which is a hard gate below (no continue-on-error). The golden-file lint
    # regression (WP-08) has been green since it landed, so that step is now
    # a hard gate too (P2-14 removed its continue-on-error).
    #
    # P2-14 adds the tb-compile step: every committed golden TB (P2-13's
    # smoke-TB generator, `*_tb.sv` under backend/tests/golden/**) is compiled
    # (not run) with `verilator --timing --binary`. Runs in the same job,
    # after the lint gate, to reuse the one Verilator install and keep total
    # CI time down. Until P2-13 lands and doc/tb goldens are regenerated +
    # committed, test_tb_compile.py collects zero cases and is a no-op — the
    # step still passes.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run lint module tests (incl. verilator integration test)
        run: uv run pytest backend/tests/lint -m ""
      - name: Run golden lint gate
        run: |
          if [ -d backend/tests/golden ] && find backend/tests/golden -name 'test_*.py' | grep -q .; then
            uv run pytest backend/tests/golden -k lint
          else
            echo "No golden lint tests yet (WP-08 pending) — skipping."
          fi
      - name: Run golden TB compile gate (P2-14)
        run: uv run pytest backend/tests/golden/test_tb_compile.py -v
      - name: Run cocotb backend run gate (P3-08, beta)
        # Executes each module's generated cocotb testbench against its
        # generated RTL under Verilator (defaults case per module, ~70s total).
        # Skips rather than fails if cocotb is absent, so it is a no-op in the
        # plain pytest job.
        run: uv run pytest backend/tests/tb/test_cocotb_run.py -v
      - name: Run checker/monitor/scoreboard compile gate (P3-06)
        # The P3-06 scaffolds ship as generated SystemVerilog but were only
        # text-asserted when they landed; nothing compiled them. These tests
        # skip when verilator is absent, so they are a no-op in the plain
        # pytest job and only do real work here.
        run: uv run pytest backend/tests/checkers/test_compile.py -v
      - name: Run reference IP TB run gate (P4-01)
        # The P4-01 IP contract is proven by a reference IP that goes through
        # the whole pipeline; this compiles and runs its generated testbench
        # over six configurations, including a prefix+camelCase naming style.
        # That naming case is the one no golden covers, and it is what found
        # the render_tb hardcoded-clock bug (TB_SPEC §7a).
        run: uv run pytest backend/tests/ips/test_run.py -v

      - name: Run AXI4-Lite register block gate (P4-02)
        # Runs the generated AXI transaction testbench across nine
        # configurations, then deliberately breaks the generator four ways and
        # asserts the suite catches each one. The mutation half is the point:
        # a bus-protocol sequence can look thorough while proving nothing.
        run: uv run pytest backend/tests/ips/test_axil_regblock_run.py -v

      - name: Run synchronous FIFO gate (P4-03a)
        # Eight configurations plus four deliberately broken generators that
        # must fail: flow control removed, read index wrong, full stuck low,
        # empty stuck low. A FIFO test that only pushes and pops never touches
        # boundary flow control or ordering.
        run: uv run pytest backend/tests/ips/test_sync_fifo_run.py -v

      - name: Run synchronous RAM gate (P4-04)
        # Includes the write-first mutation: a RAM whose read-during-write
        # returns new data is a different component, and nothing in the port
        # list distinguishes the two.
        run: uv run pytest backend/tests/ips/test_ram_run.py -v

      - name: Run AXI4-Lite GPIO gate (P4-05a)
        # The first composed IP (a spliced register block). Its mutations
        # include bypassing the input synchroniser and dropping it to a single
        # stage — a missing metastability guard never shows up in simulation,
        # so the testbench has to be timed to catch it.
        run: uv run pytest backend/tests/ips/test_axil_gpio_run.py -v

      - name: Run golden TB run gate (P3-03a, enforcing)
        # Executes each module's defaults smoke TB (SEMICRAFT_TB_RUN_ALL=1
        # for the full matrix). Went enforcing after the first advisory run
        # passed 14/14 (the one check-value bug it found — clock-divider
        # toggle sampling — was fixed at 71a4c01).
        run: uv run pytest backend/tests/golden/test_tb_run.py -v
